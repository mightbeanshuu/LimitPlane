# A deliberately dumb load balancer, standing in for a Kubernetes Service.
#
# Round-robin with no stickiness is the point: consecutive requests from one
# client land on DIFFERENT gateway replicas. If the token buckets were local to
# each process, that alone would triple every tenant's limit. Because they live
# in Redis, the budget is shared and the limit holds no matter which replica
# answers — which is exactly what scripts/prove-shared-limit.sh measures.
events {
    worker_connections 1024;
}

http {
    # Compose's internal DNS resolves `gateway` to all three container IPs.
    upstream limitplane {
        server gateway:3000;
        keepalive 32;
    }

    # Echo which replica served each request, so the proof script can show the
    # requests genuinely spreading across all three.
    log_format upstreamlog '$remote_addr -> $upstream_addr "$request" $status';
    access_log /dev/stdout upstreamlog;

    server {
        listen 80;

        location / {
            proxy_pass http://limitplane;
            proxy_http_version 1.1;

            # The real client address. Without this the gateway sees nginx's IP
            # for every request and buckets the entire internet into one
            # anon:<ip> jar — a rate limiter that limits everyone together.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # The dashboard's WebSocket needs an upgrade to survive the proxy.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE and WebSocket are long-lived by design, so no read timeout,
            # and no buffering — buffering would hold events until the buffer
            # filled and make the live feed arrive in silent bursts.
            proxy_read_timeout 3600s;
            proxy_buffering off;

            add_header X-Served-By $upstream_addr always;
        }
    }
}
