{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
  Off by default, on purpose. A value passed with --set is stored verbatim in
  the release secret, so anyone with `get secrets` in this namespace can read
  it back out of Helm's own bookkeeping — including a credential you intended
  to be write-only. Prefer creating the Secret out of band and pointing
  secrets.existingSecret at it, or use External Secrets / Sealed Secrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "limitplane.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "limitplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    A generated secret must be STABLE across upgrades. randAlphaNum alone would
    mint a new JWT signing key on every `helm upgrade`, logging every dashboard
    user out for no reason. `lookup` reads the existing Secret from the cluster
    and reuses its value; it returns empty during `helm template` and dry runs,
    which is why the fallback exists.
  */}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "limitplane.secretName" .)) }}
  {{- $jwt := .Values.secrets.jwtSecret }}
  {{- if and (not $jwt) $existing }}
  {{- $jwt = (index $existing.data "JWT_SECRET" | b64dec) }}
  {{- end }}
  JWT_SECRET: {{ $jwt | default (randAlphaNum 48) | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
{{- end }}
