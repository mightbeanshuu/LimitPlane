apiVersion: v1
kind: Service
metadata:
  name: {{ include "limitplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limitplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "limitplane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # The dashboard holds a WebSocket and the live feed an SSE stream; affinity
  # keeps one browser session pinned to one pod instead of scattering it.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
