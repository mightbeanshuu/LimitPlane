# Production overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: limitplane

resources:
  - ../../base
  - ../../observability

replicas:
  - name: limitplane
    count: 3

images:
  - name: ghcr.io/mightbeanshuu/limitplane
    # Pinned by digest, not by tag.
    #
    # `latest` is not a version, it is a bookmark that moves. A pod rescheduled
    # onto a new node pulls whatever `latest` points at NOW, so a Deployment
    # that was never touched can silently change what it runs. A digest is
    # content-addressed and cannot be repointed — it is the only tag that means
    # the same bytes tomorrow.
    newTag: v1.1.0
    # digest: sha256:...   <- set this in the release pipeline

patches:
  # Real production sizing. The base values are tuned for a laptop.
  - target: {kind: Deployment, name: limitplane}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      # Spread across availability ZONES, not just nodes. A node-level spread
      # survives a node failure; only a zone-level spread survives losing a
      # datacentre, which is the failure a multi-AZ cluster exists for.
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/-
        value:
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: limitplane
              app.kubernetes.io/component: gateway

  # Point at a managed Redis instead of the in-cluster single replica. The
  # bundled StatefulSet is a single point of failure and stores nothing
  # durably — fine for the demo, not for a system that meters billing.
  #
  # This is a STRATEGIC MERGE patch, not the JSON-patch style used above, and
  # the difference matters. A JSON patch addresses list elements by INDEX
  # (`/env/4/value`), so inserting an environment variable in base silently
  # repoints this patch at the wrong one. Strategic merge knows that env is
  # keyed by `name` and merges by that key — it keeps working when the list
  # is reordered. Use JSON patch for scalars, strategic merge for keyed lists.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: limitplane
        # The namespace is required for the patch to match: base objects
        # already carry namespace: limitplane, and kustomize matches on the
        # full identity (group/version/kind/namespace/name), not the name alone.
        namespace: limitplane
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - name: REDIS_URL
                    value: redis://limitplane-redis-primary.limitplane.svc.cluster.local:6379
