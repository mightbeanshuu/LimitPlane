apiVersion: v1
kind: ServiceAccount
metadata:
  name: limitplane
  namespace: limitplane
  labels:
    app.kubernetes.io/name: limitplane
# Every pod gets a ServiceAccount whether you declare one or not; the difference
# is that the DEFAULT service account in a namespace is shared by everything in
# it, so any permission granted to it is granted to every workload there. A
# dedicated account is what makes the RBAC below actually scoped to LimitPlane.
automountServiceAccountToken: true
