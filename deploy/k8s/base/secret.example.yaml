# EXAMPLE ONLY — do not apply this file, and never commit the real one.
#
# A Kubernetes Secret is base64, which is an ENCODING, not encryption: anyone
# who can read the object can read the value, and by default it sits in etcd
# unencrypted. Treat this as "keep it out of git", not "it is safe here". For
# real deployments use one of:
#
#   - External Secrets Operator or the Secrets Store CSI driver, pulling from
#     Vault / AWS Secrets Manager / GCP Secret Manager
#   - Sealed Secrets, which encrypts to a cluster key so the ciphertext CAN
#     live in git
#   - encryption-at-rest configured on the API server (EncryptionConfiguration)
#
# Create it by hand instead:
#   kubectl -n limitplane create secret generic limitplane-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=STRIPE_SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: limitplane-secrets
  namespace: limitplane
type: Opaque
stringData:
  # Signs dashboard sessions. Generate a real one; if it is unset the gateway
  # invents a random secret per boot, which logs everyone out on every restart
  # and, with three replicas, means a token minted by one pod is rejected by
  # the other two.
  JWT_SECRET: "replace-me-openssl-rand-hex-32"
  # Every key below is optional. Absent, the corresponding feature degrades to
  # a deterministic fallback rather than failing.
  GROQ_API_KEY: ""
  DASH_ADMIN_PASSWORD: ""
  DASH_VIEWER_PASSWORD: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_PRO: ""
  STRIPE_PRICE_ENTERPRISE: ""
