# Two tenants, showing both ways to supply a key.
#
# Create the Secret first:
#   kubectl -n limitplane create secret generic acme-api-key \
#     --from-literal=apiKey="lp_acme_$(openssl rand -hex 8)"
#
# Then watch it come alive:
#   kubectl get lpt -n limitplane -w
---
apiVersion: limitplane.dev/v1alpha1
kind: Tenant
metadata:
  name: acme
  namespace: limitplane
spec:
  tenantId: acme.example.com
  tier: pro
  org: acme-corp
  # Production: the credential lives in a Secret, so it is not in this file,
  # not in git, and rotatable without touching this object.
  apiKeySecretRef:
    name: acme-api-key
    key: apiKey
---
apiVersion: limitplane.dev/v1alpha1
kind: Tenant
metadata:
  name: demo-site
  namespace: limitplane
spec:
  tenantId: demo.limitplane.dev
  tier: free
  # Demos only. The CRD's CEL rule enforces exactly one of apiKey and
  # apiKeySecretRef, and the operator raises a Warning event when the inline
  # form is used, because a plaintext credential in a manifest is a real
  # finding in any review.
  apiKey: lp_demo_local_only
